<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>倆口田｜返回管理</title><style>body{font:18px/1.7 system-ui;background:#f5f6f1;color:#26382b;max-width:460px;margin:60px auto;padding:22px}a{display:block;padding:14px;border-radius:12px;background:#426c4d;color:white;text-align:center;text-decoration:none}</style></head><body><h1>倆口田｜田間管理</h1><p id="status">正在返回管理畫面……</p><a id="continue" hidden>在這個視窗繼續</a><script>
(() => {const params=new URLSearchParams(location.hash.slice(1)),ticket=params.get('ticket');history.replaceState(null,'',location.pathname);const status=document.getElementById('status'),link=document.getElementById('continue');if(!ticket||ticket.length>2000){status.textContent='登入連結無效，請返回田間管理重新登入。';link.href='./';link.textContent='返回田間管理';link.hidden=false;return;}if(window.opener){window.opener.postMessage({type:'liangkou-farm-ticket',ticket},location.origin);status.textContent='已送回原本的管理視窗，可以關閉此頁。';link.href='./';link.textContent='返回田間管理';link.hidden=false;setTimeout(()=>window.close(),500);}else{status.textContent='帳號已確認。請點下方按鈕繼續；手機可能會在瀏覽器中開啟。';link.href='./#ticket='+encodeURIComponent(ticket);link.hidden=false;}})();
</script></body></html>
